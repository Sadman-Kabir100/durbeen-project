name: durbeen-prod

networks:
  durbeen-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  certbot_conf:
  certbot_www:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  backup_data:

services:
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - durbeen-network

  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384m
    networks:
      - durbeen-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: always
    profiles: ["search-preview"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - durbeen-network

  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      ELASTICSEARCH_HOST: elasticsearch
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - durbeen-network
    deploy:
      resources:
        limits:
          memory: 512m

  # -------------------------------------------------------------------------
  # প্রোডাকশন migration চালানোর জন্য one-off সার্ভিস — ডিফল্টে "docker compose up" এ
  # এটা চলে না (শুধু "run --rm migrate" দিয়ে ম্যানুয়ালি চালাতে হয়, দেখুন README)।
  # Dockerfile-এর "build" স্টেজ টার্গেট করা হয়েছে কারণ ফাইনাল "production" স্টেজে
  # devDependencies (ts-node, tsconfig-paths) prune হয়ে গেছে, কিন্তু migration:run
  # কমান্ডের জন্য এগুলো লাগে।
  migrate:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      target: build
    env_file:
      - ./.env
    environment:
      DB_HOST: postgres
    command: npm run migration:run
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - durbeen-network
    profiles: ["tools"] # ডিফল্ট "up"-এ চলবে না

  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL}
    restart: always
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - durbeen-network
    deploy:
      resources:
        limits:
          memory: 512m

  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/durbeen.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - durbeen-network

  # প্রথমবার সার্টিফিকেট ইস্যু করতে (renewal loop-এর "certbot" সার্ভিস শুধু renew করে,
  # প্রথম issuance না) — README-এর SSL সেকশনে বিস্তারিত ধাপ দেখুন। ম্যানুয়ালি চালাতে হয়:
  #   docker compose -f docker-compose.prod.yml run --rm certbot-init
  certbot-init:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      certbot certonly --webroot -w /var/www/certbot
      --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email
      -d ${CERTBOT_DOMAIN} -d www.${CERTBOT_DOMAIN}
    networks:
      - durbeen-network
    profiles: ["tools"]

  # Certbot — Let's Encrypt সার্টিফিকেট রিনিউ (১২ ঘণ্টা পরপর চেক করে, মেয়াদ শেষের
  # কাছাকাছি হলেই রিনিউ করে, নাহলে no-op) — এটা প্রথম issuance করে না, উপরের certbot-init দেখুন
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done"
    networks:
      - durbeen-network

  # -------------------------------------------------------------------------
  backup:
    build:
      context: ./docker/backup
    restart: always
    env_file:
      - ./.env
    environment:
      DB_HOST: postgres
    volumes:
      - backup_data:/backups
    depends_on:
      - postgres
    networks:
      - durbeen-network

  # -------------------------------------------------------------------------
  # Monitoring
  node-exporter:
    image: prom/node-exporter:latest
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - durbeen-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - durbeen-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: always
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - durbeen-network

  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - node-exporter
      - postgres-exporter
      - redis-exporter
    networks:
      - durbeen-network

  alertmanager:
    image: prom/alertmanager:latest
    restart: always
    volumes:
      - ./docker/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - durbeen-network

  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - durbeen-network

  # -------------------------------------------------------------------------
  # Logging
  loki:
    image: grafana/loki:latest
    restart: always
    volumes:
      - ./docker/logging/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    networks:
      - durbeen-network

  promtail:
    image: grafana/promtail:latest
    restart: always
    volumes:
      - ./docker/logging/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    depends_on:
      - loki
    networks:
      - durbeen-network
