# Durbeen Redis কনফিগারেশন
# ব্যবহার: cache (Category tree, Product detail, Homepage widget — Cache Architecture
# ডকুমেন্ট অনুযায়ী) এবং ভবিষ্যতে OTP store/session store হিসেবে।

# নেটওয়ার্ক — শুধু Docker internal network থেকে অ্যাক্সেসযোগ্য (bind + protected-mode)
bind 0.0.0.0
protected-mode yes
port 6379

# পাসওয়ার্ড docker-compose.yml থেকে --requirepass দিয়ে override হয় (env var থেকে),
# এখানে হার্ডকোড করা হয়নি যাতে .env এ credential কেন্দ্রীভূত থাকে

# Persistence — RDB snapshot (দ্রুত রিস্টার্ট, cache-primarily ব্যবহারে AOF-এর প্রয়োজন কম)
save 900 1
save 300 10
save 60 10000
dir /data
dbfilename dump.rdb

# Memory — cache হিসেবে ব্যবহৃত হচ্ছে বলে limit + LRU eviction যুক্তিসঙ্গত
# (কখনো OOM এ পুরো সার্ভার ক্র্যাশ করবে না, বরং পুরনো কী ইভিক্ট করবে)
maxmemory 256mb
maxmemory-policy allkeys-lru

# স্লো লগ — পারফরম্যান্স ডিবাগিং এর জন্য (Monitoring ধাপে Grafana dashboard এই থেকে ডেটা দেখাতে পারে)
slowlog-log-slower-than 10000
slowlog-max-len 128

# ধীরে ধীরে বড় কী মুছুন যাতে মেইন থ্রেড ব্লক না হয় (Redis 4.0+ ফিচার)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
