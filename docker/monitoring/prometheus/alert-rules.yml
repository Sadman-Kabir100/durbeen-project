groups:
  - name: durbeen-infra-alerts
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL ডাউন"
          description: "postgres-exporter থেকে ১ মিনিটের বেশি সময় ধরে PostgreSQL রেসপন্স পাওয়া যাচ্ছে না।"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis ডাউন"
          description: "redis-exporter থেকে ১ মিনিটের বেশি সময় ধরে Redis রেসপন্স পাওয়া যাচ্ছে না।"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "সার্ভারের মেমরি ব্যবহার ৯০%-এর বেশি"
          description: "৫ মিনিটের বেশি সময় ধরে মেমরি ব্যবহার ৯০% অতিক্রম করেছে।"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ডিস্ক স্পেস কম (১০%-এর নিচে)"
          description: "রুট ফাইলসিস্টেমে ১০%-এর কম জায়গা বাকি — ব্যাকআপ/লগ রোটেশন যাচাই করুন।"

      - alert: PostgresHighConnections
        expr: sum(pg_stat_activity_count) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL কানেকশন সংখ্যা বেশি"
          description: "সক্রিয় কানেকশন ৮০-এর বেশি — connection pool leak বা ট্রাফিক স্পাইক যাচাই করুন।"
