user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # আপলোড সাইজ লিমিট — প্রোডাক্ট ইমেজ ও বাল্ক CSV আপলোডের জন্য ১০০০এমবি পর্যন্ত জায়গা রাখা
    client_max_body_size 100M;

    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # রেট-লিমিটিং জোন — auth/OTP এন্ডপয়েন্টে ব্রুট-ফোর্স/স্প্যাম প্রতিরোধে দ্বিতীয় স্তর
    # (ব্যাকএন্ডের OtpRateLimitMiddleware এর পরিপূরক — Nginx লেয়ারে আটকালে অ্যাপ সার্ভার
    # পর্যন্ত পৌঁছানোর আগেই রিকোয়েস্ট বাতিল হয়, রিসোর্স বাঁচে)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/m;

    include /etc/nginx/conf.d/*.conf;
}
