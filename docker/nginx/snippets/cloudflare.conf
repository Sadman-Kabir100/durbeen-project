# Cloudflare প্রক্সির (orange-cloud) পেছনে Nginx থাকলে, ডিফল্টভাবে $remote_addr
# Cloudflare-এর edge server IP দেখায়, প্রকৃত ভিজিটরের IP না। এই স্নিপেট Cloudflare-এর
# পাবলিশড IP রেঞ্জ থেকে আসা কানেকশনকে "trusted proxy" হিসেবে চিহ্নিত করে এবং
# CF-Connecting-IP হেডার থেকে আসল ভিজিটর IP restore করে — এটা ছাড়া rate-limiting
# (limit_req_zone $binary_remote_addr) এবং ব্যাকএন্ডের OtpRateLimitMiddleware ভুল IP-তে
# কাজ করবে (সব ট্রাফিক Cloudflare-এর একই কয়েকটা IP থেকে আসছে বলে মনে হবে)।
#
# ⚠️ এই রেঞ্জগুলো Cloudflare প্রকাশ করে https://www.cloudflare.com/ips/ এ — মাঝেমধ্যে
# আপডেট হয়, তাই প্রোডাকশনে ডিপ্লয়ের আগে ঐ পেজ থেকে সর্বশেষ তালিকা যাচাই করে নেওয়া উচিত।

