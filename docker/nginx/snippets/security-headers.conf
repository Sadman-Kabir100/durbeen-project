# নিরাপত্তা হেডার — সব সার্ভার ব্লকে include করা হয়
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Cloudflare এর পেছনে থাকলে HSTS Cloudflare-এর SSL/TLS সেটিং থেকেও সেট করা যায়,
# কিন্তু origin সার্ভার নিজে থেকেও পাঠানো ভালো (defense-in-depth, Cloudflare বাইপাস হলেও কাজ করে)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# সার্ভার ভার্সন হাইড করা — reconnaissance কঠিন করতে
server_tokens off;
