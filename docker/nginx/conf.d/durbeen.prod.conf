# প্রোডাকশন Nginx কনফিগ — docker-compose.prod.yml এ ব্যবহৃত।
# ⚠️ "durbeen.com" এখনো একটা placeholder ডোমেইন নাম — প্রোডাকশন ডিপ্লয়ের সময় নিচের
# সব server_name ও ssl_certificate পাথ আপনার প্রকৃত ডোমেইন দিয়ে বদলে দিতে হবে। এই
# মুহূর্তে এই ফাইলটি কোনো চলমান সার্ভিসে সক্রিয় না (শুধু docker-compose.prod.yml এ
# রেফারেন্স করা আছে, যা এখনো চালু করা হয়নি)।
# ধরে নেওয়া হয়েছে: (১) DNS Cloudflare-এ পয়েন্ট করা এবং orange-cloud (proxied) চালু,
# (২) Certbot দিয়ে origin সার্ভারে Let's Encrypt সার্টিফিকেট ইস্যু করা হয়েছে
# (দেখুন docker/backup ও README-এর SSL সেকশন — certbot সার্ভিস docker-compose.prod.yml এ আছে)।

upstream backend_upstream {
    server backend:4000;
}

upstream frontend_upstream {
    server frontend:3000;
}

# HTTP → HTTPS রিডাইরেক্ট, কিন্তু Certbot-এর ACME challenge পাথ বাদে
server {
    listen 80;
    server_name durbeen.com www.durbeen.com api.durbeen.com;

    include /etc/nginx/snippets/cloudflare.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name durbeen.com www.durbeen.com;

    include /etc/nginx/snippets/cloudflare.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    ssl_certificate     /etc/letsencrypt/live/durbeen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/durbeen.com/privkey.pem;

    location /_next/webpack-hmr {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=general_limit burst=40 nodelay;
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# আলাদা সাবডোমেইন — api.durbeen.com সরাসরি ব্যাকএন্ডে (mobile app/থার্ড-পার্টি ইন্টিগ্রেশনের জন্য সুবিধাজনক)
server {
    listen 443 ssl;
    http2 on;
    server_name api.durbeen.com;

    include /etc/nginx/snippets/cloudflare.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    ssl_certificate     /etc/letsencrypt/live/durbeen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/durbeen.com/privkey.pem;

    location /v1/auth/otp/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_upstream/api/v1/auth/otp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
