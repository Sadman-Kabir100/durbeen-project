# ডেভেলপমেন্ট Nginx কনফিগ — শুধু HTTP (SSL ছাড়া), docker-compose.yml (dev) এ ব্যবহৃত।
# প্রোডাকশনে durbeen.prod.conf ব্যবহৃত হয় (HTTPS + HTTP→HTTPS redirect সহ)।

upstream backend_upstream {
    server backend:4000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    include /etc/nginx/snippets/security-headers.conf;

    # ব্যাকএন্ড API — /api/ প্রিফিক্স দিয়ে রাউট (ব্যাকএন্ডের global prefix "api/v1" এর সাথে মেলে)
    location /api/ {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Auth/OTP এন্ডপয়েন্টে কড়া রেট-লিমিট (Nginx লেয়ার — ব্যাকএন্ডের মিডলওয়্যারের পরিপূরক)
    location /api/v1/auth/otp/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # পেমেন্ট গেটওয়ে webhook — এখানে rate-limit শিথিল রাখা হয়েছে (গেটওয়ে সার্ভার থেকে
    # legit ট্রাফিক আসে), কিন্তু নিরাপত্তা যাচাই ব্যাকএন্ডের verifySignature()-এ হয়
    location /api/v1/payments/callback/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js হট-রিলোড ওয়েবসকেট (dev মোডে)
    location /_next/webpack-hmr {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # বাকি সব রিকোয়েস্ট ফ্রন্টএন্ডে (পাবলিক সাইট + /admin দুটোই Next.js একই অ্যাপ থেকে সার্ভ হয়)
    location / {
        limit_req zone=general_limit burst=40 nodelay;

        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
