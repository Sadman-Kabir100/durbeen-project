# ⚠️ এই ফাইল শুধুমাত্র প্রথমবার SSL সার্টিফিকেট bootstrap করার জন্য — README-এর SSL সেকশনে
# বর্ণিত ধাপ অনুযায়ী সাময়িকভাবে durbeen.prod.conf-এর বদলে এটা ব্যবহার করুন, কারণ
# durbeen.prod.conf সরাসরি /etc/letsencrypt/live/.../fullchain.pem রেফারেন্স করে —
# সেই ফাইল প্রথমবার certbot-init চালানোর আগে অস্তিত্বহীন থাকায় nginx স্টার্ট হতে ব্যর্থ হবে।
# সার্টিফিকেট একবার ইস্যু হয়ে গেলে, এই ফাইলের বদলে durbeen.prod.conf ব্যবহার করে
# nginx রিস্টার্ট করুন (README দেখুন)।

upstream backend_upstream {
    server backend:4000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name durbeen.com www.durbeen.com api.durbeen.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
